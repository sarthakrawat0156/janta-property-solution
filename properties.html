<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties - Janta Property Solution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #1a5c2e; }
        .bg-primary { background-color: var(--primary) !important; }
        .text-primary-custom { color: var(--primary) !important; }
        .btn-primary-custom { background-color: var(--primary); color: white; border: none; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary-custom fs-4" href="index.html">
                <i class="fas fa-home me-2"></i>Janta Property Solution
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="properties.html">Properties</a></li>
                    <li class="nav-item"><a class="nav-link" href="brokers.html">Brokers</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="bg-primary py-4">
        <div class="container">
            <h2 class="text-white mb-0">Properties</h2>
        </div>
    </div>

    <div class="container py-5">
        <div class="row">
            <div class="col-lg-3 mb-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-filter me-2"></i>Filters</h5>
                    </div>
                    <div class="card-body">
                        <form action="properties.html" method="GET">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Type</label>
                                <select name="type" class="form-select">
                                    <option value="">All</option>
                                    <option value="sale">Buy</option>
                                    <option value="rent">Rent</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Property Type</label>
                                <select name="property_type" class="form-select">
                                    <option value="">All Types</option>
                                    <option value="Apartment">Apartment</option>
                                    <option value="House">House/Villa</option>
                                    <option value="Plot">Plot/Land</option>
                                    <option value="Commercial">Commercial</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">City</label>
                                <input type="text" name="city" class="form-control" placeholder="e.g., Delhi">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Max Price</label>
                                <input type="number" name="max_price" class="form-control" placeholder="Budget">
                            </div>
                            <button type="submit" class="btn btn-primary-custom w-100">
                                <i class="fas fa-search me-2"></i>Search
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-9">
                <h4 class="mb-4">No Properties Listed Yet</h4>
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>
                    Properties will be listed here. <a href="contact.html">Contact us</a> to add your property.
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 Janta Property Solution. All Rights Reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
